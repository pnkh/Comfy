<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>Comfy Mobile</title><style>body{margin:0;background:#0b0d11;color:#f4f6fa;font:16px system-ui;display:grid;min-height:100vh;place-items:center}.box{max-width:560px;margin:20px;padding:28px;border:1px solid #2a313c;border-radius:18px;background:#14171d;text-align:center}h1{margin:0 0 12px;color:#79e0b5}p{color:#aab4c2;line-height:1.55}button{border:1px solid #35404e;border-radius:10px;padding:11px 18px;background:#79e0b5;color:#07110d;font-weight:700;cursor:pointer}.error{color:#ff9aa4}</style></head><body><main class="box"><h1>Comfy Mobile</h1><p id="status">Đang tìm máy tính đang hoạt động…</p><button id="retry" hidden>Thử lại</button></main><script>
const status=document.getElementById('status'),retry=document.getElementById('retry');
async function go(){retry.hidden=true;status.className='';status.textContent='Đang tìm máy tính đang hoạt động…';try{const r=await fetch('./endpoint.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Chưa có endpoint');const d=await r.json();const endpoint=String(d.endpoint||'').replace(/\/+$/,'');if(!/^https:\/\//i.test(endpoint))throw new Error('Endpoint chưa hợp lệ');const suffix=location.search+location.hash;location.replace(endpoint+'/'+suffix);}catch(e){status.className='error';status.textContent='Máy tính chưa online hoặc Control Center chưa cập nhật link. Hãy bật Internet Tunnel rồi thử lại.';retry.hidden=false;}}
retry.onclick=go;go();
</script></body></html>
